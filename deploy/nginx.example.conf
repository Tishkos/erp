# nginx vhost for QS ERP — REQ-IMPROVE-001 OP-2 / OP-5 / OP-9 / OP-12.
#
# The live copy is /etc/nginx/sites-available/erp.qs-groups.com on the VPS;
# this file is the record of it (RUNBOOK-host-build.md). Keep the two the
# same: a change made on the server and not here is lost with the host.
#
# What each block is for:
#   * X-Request-ID   — nginx mints $request_id; the application reads it
#                      (src/server/request-id.ts), writes it on every log line
#                      and audit row, and shows it on the error page as the
#                      reference a person quotes to support (OP-5).
#   * X-Real-IP      — the address the sign-in lockout and the audit trail
#                      record (HARDEN HD3). X-Forwarded-For is kept too.
#   * error_page     — while deploy.sh has pm2 stopped for the migration, or
#                      the app is restarting, the upstream refuses. The
#                      maintenance page is served with 503 and Retry-After
#                      from disk, never a bare 502/504 (OP-2, IM2).
#   * client_max_body_size 26m — the same number as serverActions.
#                      bodySizeLimit in next.config.ts; both above the 25 MB
#                      attachment limit in domain/attachments.ts (OP-9).
#
server {
    listen 80;
    listen [::]:80;
    server_name erp.qs-groups.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name erp.qs-groups.com;

    ssl_certificate     /etc/letsencrypt/live/erp.qs-groups.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/erp.qs-groups.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;

    access_log /var/log/nginx/erp.access.log combined;
    error_log  /var/log/nginx/erp.error.log warn;

    client_max_body_size 26m;

    # The static page shown while the application is down. It is a file so it
    # needs nothing running; deploy.sh does not touch it.
    root /opt/qs-erp-next/deploy;
    error_page 502 503 504 =503 /maintenance.html;
    location = /maintenance.html {
        internal;
        add_header Retry-After 30 always;
        add_header Cache-Control "no-store" always;
    }

    location / {
        proxy_pass         http://127.0.0.1:3200;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Request-ID      $request_id;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_read_timeout 120s;
        proxy_intercept_errors on;
    }

    # Immutable build assets: the deployment id is in the path, so a new build
    # has new paths and the old ones may be cached for a year.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3200;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
