# nginx vhost for the demo — accounting.qs-groups.com (2026-10-16, by direction:
# "replace accounting with a demo version … one user, a different new database").
#
# scripts/ops/demo-instance.sh copies this file to
# /etc/nginx/sites-available/accounting.qs-groups.com (keeping the one it
# replaces under /root/nginx-backups/). It is erp.qs-groups.com's vhost
# (nginx.example.conf) pointed at the demo's own process on 127.0.0.1:3300,
# with its own logs; the certificate is the one certbot already issued for
# this name. The demo's database is erp_demo, never the live books.
#
server {
    listen 80;
    listen [::]:80;
    server_name accounting.qs-groups.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name accounting.qs-groups.com;

    ssl_certificate     /etc/letsencrypt/live/accounting.qs-groups.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/accounting.qs-groups.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;

    access_log /var/log/nginx/erp-demo.access.log combined;
    error_log  /var/log/nginx/erp-demo.error.log warn;

    client_max_body_size 26m;

    # The same page the live site shows while its process restarts.
    root /opt/qs-erp-next/deploy;
    error_page 502 503 504 =503 /maintenance.html;
    location = /maintenance.html {
        internal;
        add_header Retry-After 30 always;
        add_header Cache-Control "no-store" always;
    }

    location / {
        proxy_pass         http://127.0.0.1:3300;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Request-ID      $request_id;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_read_timeout 120s;
        proxy_intercept_errors on;
    }

    location /_next/static/ {
        proxy_pass http://127.0.0.1:3300;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
