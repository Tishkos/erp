# Local development database.
#
# PostgreSQL is the product here — see TECHSTACK.md Part A, constraints A1, A2,
# A4, A5 and A6 all depend on it. Integration tests run against a real instance,
# never a mock, because the guarantees under test belong to the database.

services:
  postgres:
    image: postgres:17-alpine
    container_name: erp-postgres
    restart: unless-stopped
    # The integration suite runs its 62 files serially, but each file is a fresh
    # process that opens three pools — owner (4), app (8) and the application's
    # own (10). Teardown of one file overlaps the setup of the next, so the peak
    # is roughly twice that, and the stock limit of 100 leaves no headroom: the
    # suite fails with "Connection terminated due to connection timeout" on a
    # scatter of unrelated tests, which reads as a regression and is not one.
    #
    # 300 is not tuning. It is the difference between a suite that reports what
    # the code does and one that reports what the connection limit does.
    command:
      - postgres
      - -c
      - max_connections=300
    environment:
      POSTGRES_USER: erp_owner
      POSTGRES_PASSWORD: owner_dev_password
      POSTGRES_DB: erp
      # Deterministic collation so ORDER BY is stable across machines.
      POSTGRES_INITDB_ARGS: "--locale=C --encoding=UTF8"
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/sql/00-init-roles.sql:/docker-entrypoint-initdb.d/00-init-roles.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U erp_owner -d erp"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
